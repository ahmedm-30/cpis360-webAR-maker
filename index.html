<!DOCTYPE html>
<html>
  <head>
    <title>CPIS360 WebAR</title>

    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.js"></script>
  </head>

  <body style="margin: 0; overflow: hidden;">
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">

      <a-marker preset="hiro">

        <a-box position="0 0.5 0" color="red"
          animation="property: rotation; to: 0 360 0; loop: true; dur: 3000">
        </a-box>

        <a-sphere position="1 1 0" radius="0.5" color="blue"></a-sphere>

        <a-cylinder position="-1 0.5 0" radius="0.3" height="1" color="green"></a-cylinder>

        <a-text value="Ahmed Mahrous"
                position="-1 2 0"
                color="yellow">
        </a-text>

      </a-marker>

      <a-entity camera></a-entity>

    </a-scene>
  </body>
</html>
